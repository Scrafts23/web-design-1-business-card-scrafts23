<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flexbox Card</title>
    <link rel="stylesheet" href="./template.css">
    <link rel="stylesheet" href="./flex.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Crafty+Girls&display=swap"
      rel="stylesheet">

  </head>
  <body>
    <h1>Flexbox Card</h1>

    <!-- Change landscape to portrait or square
     for a different size card -->
    <div class="card landscape">
      <div class="card-front">
        <div class="flex">
          <h1> Crafty Chains </h1>
          <h2>Friendship Braclets</h2>
        </div>
      </div>
      <div class="card-back">
        <!-- Back of card -->
        <div class="back">
          <div class="collum ">
            <h3> Custom</h3>
            <img src="images/IMG_1998-removebg-preview.png" width="100px" alt="braclet">
          </div>
          <div class="collum">
            <h3> Handmade</h3>
            <img src="images/IMG_1995-removebg-preview.png" width="20px">
          </div>
          <div class="contact">
            <h3>Unique </h3>
            <p> contact at 111-111-111 </p>
          </div>
        </div>

      </div>
    </div>
    </div>

    <!-- Honors: add this button to switch your card between
     landscape, portrait, and square:

  </body>
</html>
